name: Backend CI

on:
    push:
        branches: ["main"]

    pull_request:
        branches: ["main"]

    workflow_dispatch:

concurrency:
    group: quizarena-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Backend Tests (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                node-version: [22.x, 24.x]

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: quizarena_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d quizarena_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            NODE_ENV: test
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quizarena_test?schema=public
            SEGREDO: quizarena-ci-test-secret

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma Client
              run: npx prisma generate
              working-directory: backend

            - name: Prepare test database
              run: npx prisma db push
              working-directory: backend

            - name: Build backend
              run: npm run build
              working-directory: backend

            - name: Run backend tests
              run: npm run test:run
              working-directory: backend
