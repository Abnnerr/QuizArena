services:
  backend:
    image: backend
    container_name: backend-container
    build:
      context: ./backend
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/quizarena?schema=public"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: frontend
    container_name: frontend-container
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  db:
    image: postgres:16
    container_name: quizarena-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quizarena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quizarena"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: